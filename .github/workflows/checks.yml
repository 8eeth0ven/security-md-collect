name: Verify dashboard
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_checks.py
      - run: python tests/apk_browser_checks.py
      - name: Verify generated files are current
        run: |
          python 脚本/build_dashboard.py
          git diff --exit-code --quiet -- index.html 索引/dashboard.json 赏金APK/赏金APK看板.html 赏金APK/dashboard.json 赏金APK/dashboard.csv 赏金APK/README.md
